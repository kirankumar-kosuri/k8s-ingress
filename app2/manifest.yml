apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    project: roboshop
    purpose: ingress-demo
    app: app2
spec:
  replicas: 2
  selector: 
    matchLabels:
      project: roboshop
      purpose: ingress-demo
      app: app2
  template:
    metadata:
      labels:
        project: roboshop
        purpose: ingress-demo
        app: app2
    spec:
      containers:
      - name: app2
        image: kirankumarkosuri/app2:v1
---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector:
    project: roboshop
    purpose: ingress-demo
    app: app2
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:573025756069:certificate/65df6eb9-9c90-44ae-87dc-045ecf38b303
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - host: "app2.engg.site"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app2
            port:
              number: 80
